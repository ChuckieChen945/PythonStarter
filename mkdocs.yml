site_name: PythonStarter
site_description: Python starter
site_url: https://ChuckieChen945.github.io/PythonStarter
repo_url: https://github.com/ChuckieChen945/PythonStarter
repo_name: ChuckieChen945/PythonStarter

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material

nav:
  - Home: index.md

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
